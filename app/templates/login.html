{% extends "base.html" %}
{% block title %}Login — To Do App{% endblock %}
{% block content %}

<style>
    .login-wrap {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .login-box {
        background: #1a1a22;
        border: 1px solid #2e2e3e;
        border-radius: 20px;
        padding: 2.5rem;
        width: 100%;
        max-width: 420px;
    }
    .animate-title {
        font-size: 1.8rem;
        font-weight: 700;
        margin-bottom: 0.4rem;
        background: linear-gradient(90deg, #7c6af7, #f76a8c, #60a5fa, #7c6af7);
        background-size: 300% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: shine 3s linear infinite;
    }
    @keyframes shine {
        0% { background-position: 0% center; }
        100% { background-position: 300% center; }
    }
    .login-box p { color: #8885a0; font-size: 0.875rem; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 500;
        color: #8885a0;
        margin-bottom: 0.5rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .input-wrap {
        position: relative;
    }
    .input-wrap input {
        width: 100%;
        background: #0f0f13;
        border: 1px solid #2e2e3e;
        border-radius: 10px;
        padding: 0.75rem 3rem 0.75rem 1rem;
        color: #f0eeff;
        font-size: 0.9rem;
        transition: border-color 0.2s;
        outline: none;
    }
    .input-wrap input:focus { border-color: #7c6af7; }
    .toggle-pw {
        position: absolute;
        right: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #8885a0;
        cursor: pointer;
        font-size: 1.1rem;
        padding: 0;
        transition: color 0.2s;
    }
    .toggle-pw:hover { color: #7c6af7; }
    .btn-login {
        width: 100%;
        padding: 0.85rem;
        background: linear-gradient(135deg, #7c6af7, #f76a8c);
        border: none;
        border-radius: 10px;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: 0.5rem;
        transition: opacity 0.2s, transform 0.1s;
    }
    .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
    .register-link {
        text-align: center;
        margin-top: 1.2rem;
        font-size: 0.875rem;
        color: #8885a0;
    }
    .register-link a { color: #7c6af7; text-decoration: none; }
</style>

<div class="login-wrap">
    <div class="login-box">
        <h2 class="animate-title">Welcome back</h2>
        <p>Login to manage your tasks</p>
        <form method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <input type="text" name="username" id="username" placeholder="Enter username" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" name="password" id="password" placeholder="Enter password" required>
                    <button type="button" class="toggle-pw" id="toggleBtn">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn-login">Login →</button>
        </form>
        <div class="register-link">
            No account? <a href="{{ url_for('auth.register') }}">Register</a>
        </div>
    </div>
</div>

<script>
    const toggleBtn = document.getElementById('toggleBtn');
    const passwordInput = document.getElementById('password');

    toggleBtn.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            toggleBtn.textContent = '👁️';
        }
    });
</script>

{% endblock %}
