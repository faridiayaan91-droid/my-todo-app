<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}To Do App{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0f0f13;
            --surface: #1a1a22;
            --surface2: #22222e;
            --accent: #7c6af7;
            --accent2: #f76a8c;
            --text: #f0eeff;
            --muted: #8885a0;
            --border: #2e2e3e;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #f87171;
            --info: #60a5fa;
        }

        body {
            font-family: sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header .container {
            max-width: 960px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        nav { display: flex; gap: 0.5rem; align-items: center; }

        nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.4rem 1rem;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        nav a:hover {
            color: var(--text);
            background: var(--surface2);
            border-color: var(--border);
        }

        nav a.logout {
            color: var(--accent2);
            border-color: rgba(247,106,140,0.3);
        }

        nav a.logout:hover { background: rgba(247,106,140,0.1); }

        main {
            flex: 1;
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
        }

        .flash-success { background: rgba(74,222,128,0.1); border-left: 3px solid var(--success); color: var(--success); padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.875rem; }
        .flash-danger  { background: rgba(248,113,113,0.1); border-left: 3px solid var(--danger);  color: var(--danger);  padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.875rem; }
        .flash-info    { background: rgba(96,165,250,0.1);  border-left: 3px solid var(--info);    color: var(--info);    padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.875rem; }
        .flash-warning { background: rgba(251,191,36,0.1);  border-left: 3px solid var(--warning); color: var(--warning); padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.875rem; }

        footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 1.25rem 2rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>✦ My To Do App</h1>
            <nav>
                <a href="{{ url_for('task.view_tasks') }}">Home</a>
                {% if 'user' in session %}
                <a href="{{ url_for('auth.logout') }}" class="logout">Logout</a>
                {% else %}
                <a href="{{ url_for('auth.login') }}">Login</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash-{{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2025 My Flask To Do App</p>
    </footer>
</body>
</html>
